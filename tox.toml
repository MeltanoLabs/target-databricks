requires = [
    "tox>=4.60",
    "tox-uv>=1.36",
]
env_list = [
    "lint",
    "typing",
    { prefix = "3.", start = 13 },
]

[env_run_base]
description = "run tests on Python {py_dot_ver}"
runner = "uv-venv-runner"
dependency_groups = [ "dev" ]
pass_env = [
    "TARGET_DATABRICKS_*",
]
commands = [
    ["pytest", { replace = "posargs", default = [ "tests" ], extend = true } ],
]

[env.typing]
description = "type checks"
dependency_groups = [ "dev" ]
commands = [
    ["mypy", { replace = "posargs", default = [ "target_databricks", "tests" ], extend = true } ],
    ["ty", "check", { replace = "posargs", default = [ "target_databricks", "tests" ], extend = true } ],
]
labels = [ "check" ]

[env.lint]
description = "lint and format"
dependency_groups = [ "dev" ]
commands = [
    [ "ruff", "check", "--fix" ],
    [ "ruff", "format" ],
]
