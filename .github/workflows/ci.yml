name: Test target-databricks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
  - cron: "0 12 */7 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  # Only this Python version runs the live warehouse tests. Each run creates dozens of
  # Unity Catalog tables, and dropped tables keep counting toward the metastore quota
  # for a while, so running them on every matrix entry exhausts it.
  LIVE_PYTHON_VERSION: "3.14"

jobs:
  files-changed:
    runs-on: ubuntu-latest
    name: Detect file changes
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        filters: |
          runtime:
            - 'target_databricks/**'
            - 'tests/**'
            - 'pyproject.toml'
            - 'tox.toml'
            - '.pytest.toml'
            - '.github/workflows/ci.yml'

  build-package:
    name: Build & verify package
    needs: files-changed
    if: ${{ needs.files-changed.outputs.runtime == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: baipp

  tests:
    name: Test
    runs-on: ubuntu-latest
    needs: build-package
    strategy:
      # The live tests share one SQL warehouse, so don't run Python versions at once.
      max-parallel: 1
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run (unit tests only)
      if: ${{ matrix.python-version != env.LIVE_PYTHON_VERSION }}
      env:
        TOXENV: ${{ matrix.python-version }}
      run: uvx --with tox-uv tox
    - name: Run (with live warehouse tests)
      # Live tests also skip themselves when the secrets are empty (e.g. fork PRs).
      if: ${{ matrix.python-version == env.LIVE_PYTHON_VERSION }}
      env:
        TARGET_DATABRICKS_SERVER_HOSTNAME: ${{ secrets.TARGET_DATABRICKS_SERVER_HOSTNAME }}
        TARGET_DATABRICKS_HTTP_PATH: ${{ secrets.TARGET_DATABRICKS_HTTP_PATH }}
        TARGET_DATABRICKS_ACCESS_TOKEN: ${{ secrets.TARGET_DATABRICKS_ACCESS_TOKEN }}
        # TARGET_DATABRICKS_CATALOG: ${{ secrets.TARGET_DATABRICKS_CATALOG }}
        TOXENV: ${{ matrix.python-version }}
      run: uvx --with tox-uv tox -- tests -n 4

  static:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - name: Install tools
      run: >
        uv tool install
        --managed-python
        --with tox-uv
        tox
    - name: Static Analysis
      run: tox -m check

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - run: uvx prek run --show-diff-on-failure --all-files

  ci:
    name: CI required checks
    if: always()
    needs:
    - build-package
    - tests
    - static
    - pre-commit
    runs-on: ubuntu-latest
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
      with:
        jobs: ${{ toJSON(needs) }}
        allowed-skips: build-package,tests
