name: Test target-databricks

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  linting:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - name: Run lint command from tox.toml
      run: |
        uvx --with tox-uv tox -e lint

  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: baipp

  pytest:
    name: Tests
    runs-on: ubuntu-latest
    needs: build-package
    strategy:
      max-parallel: 2
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}
    env:
      # Live tests are skipped when these are empty (e.g. on forks).
      TARGET_DATABRICKS_SERVER_HOSTNAME: ${{ secrets.TARGET_DATABRICKS_SERVER_HOSTNAME }}
      TARGET_DATABRICKS_HTTP_PATH: ${{ secrets.TARGET_DATABRICKS_HTTP_PATH }}
      TARGET_DATABRICKS_ACCESS_TOKEN: ${{ secrets.TARGET_DATABRICKS_ACCESS_TOKEN }}
      # TARGET_DATABRICKS_CATALOG: ${{ secrets.TARGET_DATABRICKS_CATALOG }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Test
      env:
        TOXENV: ${{ matrix.python-version }}
      run: |
        uvx --with tox-uv tox
